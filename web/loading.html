    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #ddd; font-family: "Noto Sans SC", sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #111; text-align: center; }
    #loading[hidden], [hidden] { display: none; }
    h1 { margin: 0; font-size: clamp(20px, 5vw, 32px); overflow-wrap: anywhere; }
    p { margin: 0; }
    progress { width: min(320px, 75vw); justify-self: center; }
    button { justify-self: center; padding: 12px 24px; cursor: pointer; font: inherit; }
  </style>
<style>#loading-notice { max-width: 360px; justify-self: center; line-height: 1.5; }</style>




  <style id="loading-art">
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f1e8; color: #172a2d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; z-index: 2; box-sizing: border-box; display: grid; place-content: center; justify-items: center; gap: 16px; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #f5f1e8; text-align: center; }
    #loading[hidden], [hidden] { display: none; }
    #game-icon { display: block; width: 96px; height: 96px; object-fit: contain; }
    #loading h1 { max-width: min(560px, 100%); margin: 0; font-size: clamp(24px, 5vw, 36px); line-height: 1.12; font-weight: 750; color: #173d35; overflow-wrap: anywhere; }
    #loading-status, #loading-notice { max-width: min(420px, 100%); margin: 0; line-height: 1.5; }
    #loading progress { display: block; width: min(320px, 75vw); height: 8px; border: 0; border-radius: 20px; overflow: hidden; accent-color: #26734c; background: #d8e2d8; }
    #loading progress::-webkit-progress-bar { background: #d8e2d8; border-radius: 20px; }
    #loading progress::-webkit-progress-value { background: #26734c; border-radius: 20px; }
    #loading progress::-moz-progress-bar { background: #26734c; border-radius: 20px; }
    #loading button { min-height: 44px; padding: 10px 20px; border: 1px solid #26734c; border-radius: 10px; background: #26734c; color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
    #loading button:focus-visible { outline: 3px solid #df8d50; outline-offset: 4px; }
    @media (max-height: 460px) { #loading { gap: 10px; padding: 12px; } #game-icon { width: 64px; height: 64px; } #loading h1 { font-size: clamp(21px, 4vw, 30px); } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>

    <h1 id="game-title"></h1>
    <p id="loading-status">Preparando a simulação…</p>
    <progress id="loading-progress" aria-label="Progresso do carregamento"></progress>
    <p id="loading-notice" hidden></p>
    <button id="loading-retry" type="button" hidden>Tentar novamente</button>
    <noscript>JavaScript é necessário para jogar.</noscript>
  </section>
  <script>
    (() => {
      const config = $GODOT_CONFIG;
      const threads = $GODOT_THREADS_ENABLED;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      document.getElementById('game-title').textContent = document.title;
      const copy = {
        loading: 'Carregando…',
        starting: 'Iniciando o jogo…',
        retry: 'Tentar novamente',
        progress: 'Progresso do carregamento',
        failure: 'Não foi possível carregar o jogo. Tente novamente.',
        stalled: 'Carregamento sem avanços recentes. Você pode aguardar ou tentar novamente.',
        waiting: 'O jogo ainda está carregando. Você pode aguardar ou tentar novamente.'
      };
      document.documentElement.lang = 'pt-BR';
      status.textContent = copy.loading;
      retry.textContent = copy.retry;
      progress.setAttribute('aria-label', copy.progress);
      retry.addEventListener('click', () => window.location.reload());
      let failed = false;
      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      let downloadComplete = false;
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        const message = performance.now() - lastProgressAt >= 30000
          ? copy.stalled : copy.waiting;
        if (notice.textContent !== message) notice.textContent = message;
      };
      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      // Time alone cannot prove failure: downloads and WASM compilation may be slow.
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[game-loading] Startup failed', error);
        loading.hidden = false;
        status.textContent = copy.failure;
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };
      // Some Godot bootstrap promises do not forward download/compile failures.
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);
      const onProgress = (current, total) => {
        if (failed || ready) return;
        // Repeated/unknown totals do not renew liveness; growing byte counts do.
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        if (!downloadComplete && Number.isFinite(total) && total > 0 && Number.isFinite(current) && current >= total) {
          downloadComplete = true;
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = copy.loading;
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total
          ? copy.starting
          : `${Math.floor(current / total * 100)}%`;
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          // Download completion alone is not engine readiness.
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = '$GODOT_URL';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
